version: "3.9"

services:
  registrator-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: "/bin/registrator-api --config /etc/config.yaml"
    container_name: registrator-api
    env_file:
      - path: .env
        required: true
    networks:
      - network
    ports:
      - "8080:8080"

networks:
  network:
    driver: bridge