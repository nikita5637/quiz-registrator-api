version: "3.9"

services:
  registrator-api:
    build:
      args:
        BASE_IMAGE: ${BASE_IMAGE}
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    command: "/bin/registrator-api --config /etc/config.yaml"
    container_name: registrator-api
    env_file:
      - path: .env
        required: false
    networks:
      - network

networks:
  network:
    driver: bridge